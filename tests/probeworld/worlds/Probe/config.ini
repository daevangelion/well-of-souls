; config.ini
;
; Your world may override certain default values.  Note: many of the examples in this file
; have been 'commented out' by adding a semicolon to the front.  Be sure to remove that
; semicolon if you really want to override that parameter
;
[General]
; this replaces the 'GP' designation used throughout the game.  If your replacement is much
; wider than 'GP' it is not guaranteed to be displayed without clipping.
;goldName = GP
;---
; these affect PK damage in your world.  Basically the same computation is made when a player
; attacks another player, but at the last moment it is multiplied by these percentages,
; hence you can make PK battles last longer or shorter times in your world.
; Does NOT affect healing.
;pkHandPercent = 100
;pkMagicPercent = 100
;---
; this is used to increase (>100) or decrease (<100) the percentage of successful spell casts
;spellSuccessPercent = 100
;---
; set this to a positive value to enable the posting of normal PK 'karma points' as 'war points' to the War Ladder
; otherwise, comment it out, or set it to 0. The value 'scales' the points (bigger value, fewer points)
; These war points are applied only to the specific war(s) between you and the guy you killed.
karmaPointsAreAlsoWarPoints=234
;---
; set this to non-zero to enable "XP Earned from Monster Kills" to drive 'war points' on the war ladder
; If you set this to 1000, for example, you will earn one war point per 1000 monster XP points
; These points are awarded to your guild for ALL its open wars at once.
monsterXPAreAlsoWarPoints=1000
;---
; un-comment this, and set it to non-zero to enable "Players cannot give each other gold"
;noGivingGP = 1
;---
; The following enables cookie protection in your world.  There are three allowed values:
; 0 - no cookies are protected
; 1 - only cookies whose names start with 'secure' are protected e.g. "secureAge"
; 2 - all cookies are protected
;
; Note, if you turn protection on for a cookie, you cannot subsequently turn it off without
; damaging any characters who used the cookie while it was protected.
cookieProtection = 1
;---
; Use this to specify which, if any, trophy is earned for killing a PKer
pkTrophy=1000
;---
; Use this to suppress pets from ever biting people, anywhere in the world
petsCanBitePeople=0
;---
; use this to limit how much PP they can earn before they have to spend it
maxUnspentPP = 100000
;---
; use this to protect PKers from attack by other PKers more than this many levels above them
maxPKAttackAdvantage = 10
;--
; use this to put a 'world home' button on the servername panel just below the splitter bar
worldHomeUrl = http://www.synthetic-reality.com/wosHome.htm
;---
; use this to set how much gold a new character starts out with (character class notwithstanding)
startingGP=500
;---
; Use this to declare where your world's "WoS Tactics" assets come from.  Set it to NONE
; if you wish to not fetch tactics assets from the web.  (In which case, you can still
; provide a tactics folder with your world, but you will only be able to update members
; by having them update their copy of your world.
; Leave it blank if you want to use the stock assets, downloaded from synthetic reality
; If you do provide hosting, set this to the url of the folder on your web site which
; contains the individual files used by wos tactics (tactics.ini and related files)
; for example:
; tacticsSourceUrl=http://www.synthetic-reality.com/tactics
tacticsSourceUrl=http://www.synthetic-reality.com/tactics
;---
; use this to enable the awarding of War Ladder points for winning Tactics Battles
; The first place winner will earn this many points in all open wars against the 2nd, 3rd, and 4th place players
; The second place winner will earn 1/4 of this many points in all open wars against the 3rd and 4th place players
; The thid place winner will earn 1/16 of this many points in all open wars against the 4th place player
tacticsWinGivesWarPoints=1000

